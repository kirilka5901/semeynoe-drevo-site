<style>
:root{--bg:#F2F2F7;--surface:#FFFFFF;--surface-2:#F2F2F7;--text:#1C1C1E;--muted:#5C5C63;--line:#E2E2E8;--accent:#0A63D8;--err:#B3261E;--err-bg:#FCE8E6;color-scheme:light}
:root[data-theme="dark"]{--bg:#111215;--surface:#1C1C20;--surface-2:#26262B;--text:#F4F4F6;--muted:#B4B4BC;--line:#2E2E35;--accent:#4C9DFF;--err:#F2B8B5;--err-bg:#3A1E1C;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Golos Text","PT Sans","Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.wrap{min-height:100%;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.card{width:min(420px,100%);background:var(--surface);border-radius:24px;padding:36px 32px 30px;box-shadow:0 0 0 1px var(--line),0 24px 60px -28px rgba(0,0,0,.35);text-align:center}
.logo{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#6DB6FF,#0A63D8);box-shadow:0 10px 22px -10px rgba(10,99,216,.7)}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 8px;font-weight:700}
.lead{margin:0 0 26px;color:var(--muted);font-size:1.02rem}
.field{position:relative;margin:0 0 14px}
.field input{width:100%;height:58px;font:inherit;font-size:1.15rem;padding:0 56px 0 18px;border-radius:16px;border:2px solid var(--line);background:var(--surface-2);color:var(--text);outline:none;transition:border-color .15s,background .15s}
.field input:focus{border-color:var(--accent);background:var(--surface)}
.field input::placeholder{color:var(--muted);-webkit-text-security:none}
.field input.masked{-webkit-text-security:disc;text-security:disc}
html,body{overscroll-behavior:none}

  e.querySelector("span").textContent = "Не удалось загрузить сайт. Проверьте интернет и обновите страницу.";
  e.classList.remove("hidden");
}
function savedHash() {
  try { return localStorage.getItem(templateConfig.rememberPassphraseKey) || sessionStorage.getItem(SESSION_KEY); } catch (e) { return null; }
}
window.onload = async function () {
  const hash = savedHash();
  if (!hash) showForm(); // форма сразу, данные догружаются в фоне
  try { await ready; } catch (e) { showLoadError(); return; }
  if (!hash) return;
  let ok = false;
  try {
    if (localStorage.getItem(templateConfig.rememberPassphraseKey)) ok = (await staticrypt.handleDecryptOnLoad()).isSuccessful;
    else ok = (await staticrypt.handleDecryptionOfPageFromHash(hash, false)).isSuccessful;
  } catch (e) {}
  if (!ok) { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} showForm(); }
};

const eye = document.getElementById("eye"), pw = document.getElementById("staticrypt-password");
// На телефонах — обычное поле пароля (там надёжно скрывается и показывается, русская раскладка работает).
// На компьютере — текстовое поле с маской: на Mac в поле пароля нельзя переключиться на русский.
const touch = matchMedia("(pointer: coarse)").matches;
if (touch) { pw.type = "password"; pw.classList.remove("masked"); }
eye.addEventListener("pointerdown", function (e) { e.preventDefault(); }); // не убирать клавиатуру
eye.addEventListener("click", function () {
  const show = touch ? pw.type === "password" : pw.classList.contains("masked");
  if (touch) pw.type = show ? "text" : "password";
  else { pw.classList.toggle("masked", !show); const v = pw.value; pw.value = ""; pw.value = v; }
  document.getElementById("eyeOn").classList.toggle("hidden", show);
  document.getElementById("eyeOff").classList.toggle("hidden", !show);
  const t = show ? templateToggleAltHide : templateToggleAltShow;
  eye.setAttribute("aria-label", t); eye.title = t; pw.focus();
});
pw.addEventListener("input", function () { document.getElementById("err").classList.add("hidden"); });

document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  const go = document.getElementById("go"); go.disabled = true;
  const label = go.textContent; go.textContent = "Открываю…";
  try { await ready; } catch (e) { go.disabled = false; go.textContent = label; showLoadError(); return; }
  const password = pw.value.trim(), isRememberChecked = document.getElementById("staticrypt-remember").checked;
  const { isSuccessful, hashedPassword } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
  if (isSuccessful && hashedPassword) { try { sessionStorage.setItem(SESSION_KEY, hashedPassword); } catch (e) {} }
  if (!isSuccessful) { go.disabled = false; go.textContent = label; const er = document.getElementById("err"); er.querySelector("span").textContent = templateError; er.classList.remove("hidden"); pw.select(); }
});
</script>
